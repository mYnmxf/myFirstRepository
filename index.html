<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf6" />
    <title>给你一朵玫瑰</title>
    <style>
      :root {
        color-scheme: light;
        background: #fffaf6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fffaf6;
      }

      body {
        min-height: 100dvh;
      }

      .stage {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="一朵正在被画出的玫瑰">
      <canvas id="roseCanvas" role="img" aria-label="从枝干、叶子到花瓣逐步绘制的玫瑰"></canvas>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById("roseCanvas");
        const ctx = canvas.getContext("2d");
        const DESIGN_WIDTH = 390;
        const DESIGN_HEIGHT = 844;
        const palette = {
          stemDark: "#1e6642",
          stem: "#358a56",
          stemLight: "#8acb83",
          leafDark: "#2d7549",
          leaf: "#4c9d61",
          leafLight: "#8dcc85",
          petalDeep: "#a5264d",
          petalOuter: "#d63b67",
          petal: "#e95378",
          petalLight: "#f7829c",
          petalPale: "#f9aab8",
          ink: "#8e2149",
          vein: "#bd3f61",
          core: "#a92652",
          center: "#76183e",
          paper: "#fffaf6",
          paperGlow: "#fcecef"
        };

        let viewportWidth = 0;
        let viewportHeight = 0;
        let pixelRatio = 1;
        let elapsed = 0;
        const startedAt = performance.now();

        function clamp(value, min = 0, max = 1) {
          return Math.max(min, Math.min(max, value));
        }

        function ease(value) {
          const t = clamp(value);
          return 1 - Math.pow(1 - t, 3);
        }

        function cubicPoint(a, b, c, d, t) {
          const inverse = 1 - t;
          return [
            inverse * inverse * inverse * a[0] +
              3 * inverse * inverse * t * b[0] +
              3 * inverse * t * t * c[0] +
              t * t * t * d[0],
            inverse * inverse * inverse * a[1] +
              3 * inverse * inverse * t * b[1] +
              3 * inverse * t * t * c[1] +
              t * t * t * d[1]
          ];
        }

        function makePath(start, curves, closed = true) {
          const points = [start];
          let current = start;

          curves.forEach((curve) => {
            const controlOne = curve[0];
            const controlTwo = curve[1];
            const end = curve[2];
            for (let index = 1; index <= 28; index += 1) {
              points.push(cubicPoint(current, controlOne, controlTwo, end, index / 28));
            }
            current = end;
          });

          if (closed) {
            points.push(start);
          }

          return points;
        }

        function ellipse(cx, cy, radiusX, radiusY, rotation = 0, steps = 64) {
          const points = [];
          const cosine = Math.cos(rotation);
          const sine = Math.sin(rotation);

          for (let index = 0; index <= steps; index += 1) {
            const angle = (Math.PI * 2 * index) / steps;
            const x = Math.cos(angle) * radiusX;
            const y = Math.sin(angle) * radiusY;
            points.push([
              cx + x * cosine - y * sine,
              cy + x * sine + y * cosine
            ]);
          }

          return points;
        }

        function line(start, curves) {
          return makePath(start, curves, false);
        }

        function fillPath(points) {
          ctx.beginPath();
          ctx.moveTo(points[0][0], points[0][1]);
          for (let index = 1; index < points.length; index += 1) {
            ctx.lineTo(points[index][0], points[index][1]);
          }
          ctx.closePath();
          ctx.fill();
        }

        function tracePath(points, progress) {
          const finalIndex = (points.length - 1) * clamp(progress);
          const wholeIndex = Math.floor(finalIndex);
          const fraction = finalIndex - wholeIndex;

          ctx.beginPath();
          ctx.moveTo(points[0][0], points[0][1]);

          for (let index = 1; index <= wholeIndex; index += 1) {
            ctx.lineTo(points[index][0], points[index][1]);
          }

          if (wholeIndex < points.length - 1) {
            const from = points[wholeIndex];
            const to = points[wholeIndex + 1];
            ctx.lineTo(
              from[0] + (to[0] - from[0]) * fraction,
              from[1] + (to[1] - from[1]) * fraction
            );
          }

          ctx.stroke();
        }

        function drawTask(task, time) {
          const rawProgress = clamp((time - task.start) / task.duration);
          if (rawProgress <= 0) {
            return;
          }

          const progress = ease(rawProgress);
          ctx.save();
          ctx.lineCap = task.lineCap || "round";
          ctx.lineJoin = "round";
          ctx.lineWidth = task.lineWidth || 2;

          if (task.fill) {
            const fillStart = task.fillStart === undefined ? 0.58 : task.fillStart;
            const fillProgress = clamp((progress - fillStart) / (1 - fillStart));
            if (fillProgress > 0) {
              ctx.globalAlpha = fillProgress;
              ctx.fillStyle = task.fill;
              fillPath(task.points);
            }
          }

          ctx.globalAlpha = task.alpha === undefined ? 1 : task.alpha;
          ctx.strokeStyle = task.stroke;
          tracePath(task.points, progress);
          ctx.restore();
        }

        function drawBackground() {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = palette.paper;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const glow = ctx.createRadialGradient(
            viewportWidth * 0.5 * pixelRatio,
            viewportHeight * 0.36 * pixelRatio,
            0,
            viewportWidth * 0.5 * pixelRatio,
            viewportHeight * 0.36 * pixelRatio,
            viewportWidth * 0.58 * pixelRatio
          );
          glow.addColorStop(0, palette.paperGlow);
          glow.addColorStop(1, "rgba(255, 250, 246, 0)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawScene(time) {
          drawBackground();

          const scale = Math.min(
            viewportWidth / DESIGN_WIDTH,
            viewportHeight / DESIGN_HEIGHT
          );
          const offsetX = (viewportWidth - DESIGN_WIDTH * scale) / 2;
          const offsetY = (viewportHeight - DESIGN_HEIGHT * scale) / 2;
          ctx.setTransform(
            pixelRatio * scale,
            0,
            0,
            pixelRatio * scale,
            pixelRatio * offsetX,
            pixelRatio * offsetY
          );

          tasks.forEach((task) => drawTask(task, time));
        }

        function resize() {
          viewportWidth = window.innerWidth;
          viewportHeight = window.innerHeight;
          pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.max(1, Math.round(viewportWidth * pixelRatio));
          canvas.height = Math.max(1, Math.round(viewportHeight * pixelRatio));
          canvas.style.width = viewportWidth + "px";
          canvas.style.height = viewportHeight + "px";
          drawScene(elapsed);
        }

        const stem = line([194, 776], [
          [[188, 680], [197, 500], [195, 365]]
        ]);
        const stemHighlight = line([192, 770], [
          [[190, 660], [198, 500], [197, 382]]
        ]);

        const leftLeaf = makePath([194, 575], [
          [[163, 546], [111, 532], [72, 555]],
          [[91, 591], [145, 607], [194, 579]]
        ]);
        const rightLeaf = makePath([197, 679], [
          [[230, 649], [282, 622], [320, 641]],
          [[299, 680], [246, 704], [197, 684]]
        ]);
        const smallLeaf = makePath([196, 468], [
          [[177, 447], [148, 438], [125, 449]],
          [[142, 476], [169, 485], [196, 472]]
        ]);

        const sepalLeft = makePath([194, 354], [
          [[166, 351], [139, 365], [115, 389]],
          [[145, 393], [172, 382], [194, 364]]
        ]);
        const sepalCenter = makePath([194, 357], [
          [[183, 376], [184, 395], [195, 413]],
          [[207, 394], [208, 376], [195, 357]]
        ]);
        const sepalRight = makePath([196, 356], [
          [[224, 351], [251, 364], [275, 389]],
          [[245, 394], [218, 382], [196, 364]]
        ]);

        const backTop = makePath([195, 229], [
          [[159, 206], [141, 171], [151, 138]],
          [[161, 106], [191, 92], [216, 114]],
          [[241, 138], [231, 181], [195, 229]]
        ]);
        const backLeft = makePath([195, 263], [
          [[164, 237], [122, 230], [94, 253]],
          [[74, 232], [83, 188], [112, 174]],
          [[141, 160], [174, 178], [195, 205]],
          [[210, 225], [209, 249], [195, 263]]
        ]);
        const backRight = makePath([195, 263], [
          [[226, 237], [268, 230], [296, 253]],
          [[316, 232], [307, 188], [278, 174]],
          [[249, 160], [216, 178], [195, 205]],
          [[180, 225], [181, 249], [195, 263]]
        ]);
        const outerLeft = makePath([105, 246], [
          [[78, 268], [84, 311], [117, 335]],
          [[145, 355], [174, 348], [195, 326]],
          [[164, 321], [132, 296], [105, 246]]
        ]);
        const outerRight = makePath([285, 246], [
          [[312, 268], [306, 311], [273, 335]],
          [[245, 355], [216, 348], [195, 326]],
          [[226, 321], [258, 296], [285, 246]]
        ]);
        const outerBottom = makePath([91, 253], [
          [[94, 310], [133, 362], [194, 384]],
          [[252, 363], [291, 310], [299, 253]],
          [[269, 282], [232, 302], [194, 307]],
          [[155, 302], [119, 281], [91, 253]]
        ]);

        const middleLeft = makePath([195, 278], [
          [[165, 294], [131, 282], [117, 255]],
          [[104, 229], [115, 198], [140, 186]],
          [[164, 174], [189, 188], [199, 211]],
          [[177, 218], [163, 232], [166, 249]],
          [[169, 263], [183, 273], [195, 278]]
        ]);
        const middleRight = makePath([195, 278], [
          [[225, 294], [259, 282], [273, 255]],
          [[286, 229], [275, 198], [250, 186]],
          [[226, 174], [201, 188], [191, 211]],
          [[213, 218], [227, 232], [224, 249]],
          [[221, 263], [207, 273], [195, 278]]
        ]);
        const middleBottom = makePath([117, 266], [
          [[124, 315], [163, 345], [201, 347]],
          [[239, 343], [273, 313], [278, 266]],
          [[251, 285], [231, 299], [201, 302]],
          [[169, 304], [144, 289], [117, 266]]
        ]);

        const innerLeft = makePath([199, 266], [
          [[178, 278], [153, 262], [151, 239]],
          [[149, 218], [168, 201], [188, 207]],
          [[204, 212], [212, 225], [210, 240]],
          [[208, 252], [204, 261], [199, 266]]
        ]);
        const innerRight = makePath([191, 266], [
          [[212, 278], [237, 262], [239, 239]],
          [[241, 218], [222, 201], [202, 207]],
          [[186, 212], [178, 225], [180, 240]],
          [[182, 252], [186, 261], [191, 266]]
        ]);
        const innerTop = makePath([195, 258], [
          [[177, 244], [174, 221], [188, 210]],
          [[201, 199], [222, 207], [224, 226]],
          [[226, 244], [211, 258], [195, 258]]
        ]);
        const centerPetal = makePath([195, 276], [
          [[177, 269], [169, 250], [180, 238]],
          [[190, 227], [209, 228], [217, 242]],
          [[226, 258], [214, 274], [195, 276]]
        ]);

        const veins = [
          line([105, 247], [
            [[119, 270], [144, 288], [173, 297]]
          ]),
          line([285, 247], [
            [[271, 270], [246, 288], [217, 297]]
          ]),
          line([151, 141], [
            [[168, 158], [181, 176], [190, 198]]
          ]),
          line([239, 141], [
            [[222, 158], [209, 176], [200, 198]]
          ]),
          line([126, 210], [
            [[148, 215], [163, 225], [174, 242]]
          ]),
          line([264, 210], [
            [[242, 215], [227, 225], [216, 242]]
          ]),
          line([140, 315], [
            [[158, 329], [178, 335], [194, 337]]
          ]),
          line([250, 315], [
            [[232, 329], [212, 335], [196, 337]]
          ])
        ];

        const spiral = line([195, 272], [
          [[174, 270], [166, 251], [180, 239]],
          [[195, 226], [222, 237], [218, 256]],
          [[215, 274], [194, 284], [184, 273]],
          [[177, 265], [181, 253], [191, 250]]
        ]);

        const tasks = [
          { start: 0.0, duration: 1.35, points: stem, stroke: palette.stemDark, lineWidth: 18 },
          { start: 0.45, duration: 1.1, points: stemHighlight, stroke: palette.stemLight, lineWidth: 5, alpha: 0.8 },
          { start: 0.95, duration: 0.95, points: leftLeaf, stroke: palette.leafDark, fill: palette.leaf, lineWidth: 3 },
          { start: 1.35, duration: 0.95, points: rightLeaf, stroke: palette.leafDark, fill: palette.leaf, lineWidth: 3 },
          { start: 1.7, duration: 0.8, points: smallLeaf, stroke: palette.leafDark, fill: palette.leafLight, lineWidth: 3 },
          { start: 2.15, duration: 0.75, points: sepalLeft, stroke: palette.leafDark, fill: palette.leaf, lineWidth: 3 },
          { start: 2.3, duration: 0.75, points: sepalCenter, stroke: palette.leafDark, fill: palette.leafLight, lineWidth: 3 },
          { start: 2.45, duration: 0.75, points: sepalRight, stroke: palette.leafDark, fill: palette.leaf, lineWidth: 3 },
          { start: 2.3, duration: 1.0, points: backTop, stroke: palette.ink, fill: palette.petalLight, lineWidth: 3 },
          { start: 2.65, duration: 1.0, points: backLeft, stroke: palette.ink, fill: palette.petal, lineWidth: 3 },
          { start: 2.85, duration: 1.0, points: backRight, stroke: palette.ink, fill: palette.petal, lineWidth: 3 },
          { start: 3.2, duration: 0.95, points: outerLeft, stroke: palette.ink, fill: palette.petalOuter, lineWidth: 3 },
          { start: 3.35, duration: 0.95, points: outerRight, stroke: palette.ink, fill: palette.petalOuter, lineWidth: 3 },
          { start: 3.55, duration: 1.0, points: outerBottom, stroke: palette.ink, fill: palette.petalDeep, lineWidth: 3 },
          { start: 4.0, duration: 0.95, points: middleLeft, stroke: palette.ink, fill: palette.petalLight, lineWidth: 3 },
          { start: 4.15, duration: 0.95, points: middleRight, stroke: palette.ink, fill: palette.petalLight, lineWidth: 3 },
          { start: 4.35, duration: 0.95, points: middleBottom, stroke: palette.ink, fill: palette.petal, lineWidth: 3 },
          { start: 4.75, duration: 0.85, points: innerLeft, stroke: palette.ink, fill: palette.petalPale, lineWidth: 3 },
          { start: 4.9, duration: 0.85, points: innerRight, stroke: palette.ink, fill: palette.petalPale, lineWidth: 3 },
          { start: 5.1, duration: 0.85, points: innerTop, stroke: palette.ink, fill: palette.petalLight, lineWidth: 3 },
          { start: 5.35, duration: 0.8, points: centerPetal, stroke: palette.ink, fill: palette.core, lineWidth: 3 },
          ...veins.map((points, index) => ({
            start: 5.85 + index * 0.12,
            duration: 0.6,
            points,
            stroke: palette.vein,
            lineWidth: 2,
            alpha: 0.75
          })),
          { start: 6.75, duration: 1.25, points: spiral, stroke: palette.center, lineWidth: 5 }
        ];

        function animate(now) {
          elapsed = (now - startedAt) / 1000;
          drawScene(elapsed);
          if (elapsed < 8.5) {
            window.requestAnimationFrame(animate);
          }
        }

        window.addEventListener("resize", resize, { passive: true });
        resize();
        window.requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
